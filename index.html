<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>磁力追踪器 · MagnetTracker</title>
  <meta name="description" content="追踪网页中的最新磁力链接，自动获取更新日期">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </div>
        <div class="logo-text">
          <h1>磁力追踪器</h1>
          <span class="logo-sub">MagnetTracker</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="filter-group">
          <select id="resFilter" class="btn btn-ghost select-rounded">
            <option value="all">任意清晰度</option>
            <option value="1080p">仅 1080p</option>
            <option value="2160p">仅 2160p / 4K</option>
            <option value="720p">仅 720p</option>
          </select>
        </div>
        <button id="refreshAllBtn" class="btn btn-ghost" title="刷新全部">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          刷新全部
        </button>
        <button id="copyAllLatestBtn" class="btn btn-ghost" title="复制所有最新磁力">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2-2v1"></path>
          </svg>
          复制所有最新
        </button>
        <button id="sendAllNasBtn" class="btn btn-ghost" title="发送所有最新至 NAS">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          全部推送到 NAS
        </button>
        <button id="openInTabBtn" class="btn btn-ghost" title="在新标签页中打开">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
          新标签页
        </button>
        <button id="synoSettingsBtn" class="btn btn-icon" title="Synology NAS 设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
        </button>
        <button id="themeToggleBtn" class="btn btn-icon" title="切换主题">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2"></svg>
        </button>
      </div>
    </header>

    <!-- Add URL Panel -->
    <div class="add-panel">
      <div class="add-panel-inner">
        <div class="input-group">
          <div class="input-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
          </div>
          <input type="url" id="urlInput" placeholder="输入页面链接，例如 https://www.xl720.com/thunder/60931.html"
            autocomplete="off" spellcheck="false" />
          <button id="addUrlBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            添加
          </button>
        </div>
        <p class="add-hint">支持 动漫花园、xl720.com 等磁力资源站，添加后自动抓取最近更新</p>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="statusBar" class="status-bar hidden">
      <div class="status-spinner"></div>
      <span id="statusText">正在获取数据...</span>
    </div>

    <!-- Error Toast -->
    <div id="errorToast" class="toast toast-error hidden">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="errorText"></span>
    </div>

    <!-- Cards Grid -->
    <main class="cards-grid" id="cardsGrid">
      <!-- Empty State -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>
        <h2>暂无追踪链接</h2>
        <p>在上方输入框中添加页面链接，即可自动追踪最新磁力资源</p>
        <div class="empty-examples">
          <span class="example-tag" id="example1">动漫花园 (搜索列表)</span>
          <span class="example-tag" id="example2">电影港 (详情页)</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Magnet Detail Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="magnetModal">
      <div class="modal-header">
        <h3 id="modalTitle">磁力链接列表</h3>
        <button class="modal-close" id="modalClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Synology Settings Modal -->
  <div class="modal-overlay hidden" id="synoModalOverlay">
    <div class="modal" id="synoModal">
      <div class="modal-header">
        <h3>Synology Download Station 设置</h3>
        <button class="modal-close" id="synoModalClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="synoModalBody">
        <div class="form-group">
          <label for="synoUrl">Synology 访问基准地址 (需包含 http/https) <br/><span style="font-size: 0.8rem; opacity: 0.7; font-weight: normal;">提示：由于自签名 HTTPS 证书可能被 Chrome 拦截导致「认证失败」，推荐改用 HTTP 端口（如：http://192.168.7.11:5000/）测试！如果使用 DownloadCenter 别名，确保路径以 <b>"/"</b> 结尾。</span></label>
          <input type="text" id="synoUrl" class="input-field" value="http://192.168.7.11:5000/" />
        </div>
        <div class="form-group">
          <label for="synoUser">NAS 用户名</label>
          <input type="text" id="synoUser" placeholder="admin" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="synoPass">密码</label>
          <input type="password" id="synoPass" placeholder="••••••••" autocomplete="off" />
        </div>
        <button id="saveSynoBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          保存 & 测试连接
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
